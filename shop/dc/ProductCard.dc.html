<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карточка товара в списке</title>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<article style="font-family: 'Onest', Arial, sans-serif; color: #17191E; font-size: 15px; line-height: 1.4; box-sizing: border-box; width: 100%; min-height: 560px; background: #FFFFFF; border-radius: 22px; padding: 8px; display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; height: 240px; border-radius: 16px; background: #F1EFEA; display: flex; align-items: center; justify-content: center; overflow: hidden">
<sc-if value="{{ hasBadge }}" hint-placeholder-val="{{ true }}">
<span style="position: absolute; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; background: {{ badgeBg }}; color: {{ badgeFg }}; font-size: 12.5px; font-weight: 600">{{ badge }}</span>
</sc-if>
<button type="button" aria-label="Добавить в избранное" style="position: absolute; top: 8px; right: 8px; width: 44px; height: 44px; border: 0; border-radius: 50%; background: #FFFFFF; color: #17191E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"></path></svg></button>
<sc-if value="{{ hasImg }}" hint-placeholder-val="{{ true }}"><img src="{{ img }}" alt="{{ name }}" style="display: block; max-width: 82%; height: 196px; object-fit: contain; filter: drop-shadow(0 14px 16px rgba(23,25,30,0.16))"></sc-if>
<sc-if value="{{ noImg }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="width: 80px; height: 160px; border-radius: 16px; background: {{ color }}"></span></sc-if>
</div>
<div style="flex: 1 1 auto; padding: 12px 10px 6px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: #5C626C">
<span style="display: inline-flex; align-items: center; gap: 5px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="#E8A11A"><path d="M12 3l2.7 5.6 6.1.8-4.4 4.3 1.1 6.1-5.5-2.9-5.5 2.9 1.1-6.1-4.4-4.3 6.1-.8z"></path></svg><span style="color: #17191E; font-weight: 600">{{ rating }}</span><span>· {{ reviews }}</span></span>
<span role="img" aria-label="{{ colorsLabel }}" style="display: inline-flex; gap: 4px">
<sc-for list="{{ colors }}" as="c" hint-placeholder-count="3"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 50%; background: {{ c.hex }}; box-shadow: {{ c.ring }}"></span></sc-for>
</span>
</div>
<a href="product.html" style="min-height: 46px; font-family: 'Jost', sans-serif; font-weight: 500; font-size: 17.5px; line-height: 23px; color: #17191E; text-decoration: none">{{ name }}</a>
<div style="margin-top: auto; display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px">
<span style="font-family: 'Jost', sans-serif; font-size: 24px; font-weight: 600; color: {{ priceColor }}">{{ price }}</span>
<sc-if value="{{ hasOld }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; color: #5C626C; text-decoration: line-through">{{ old }}</span></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12.5px">
<span style="padding: 3px 9px; border-radius: 999px; background: #FFF1C7; color: #6B4500; font-weight: 600">+{{ bonus }} бонусов</span>
<span style="padding: 3px 9px; border-radius: 999px; background: #F1EFEA; color: #454B55">от {{ credit }} ₽/мес</span>
</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #454B55">
<span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{ stockDot }}"></span><span>{{ stock }}</span>
</div>
</div>
<div style="display: flex; gap: 6px">
<button type="button" style="flex: 1 1 auto; height: 48px; border: 0; border-radius: 14px; background: #0B7A55; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">В корзину</button>
<button type="button" aria-label="Добавить к сравнению" style="flex: none; width: 48px; height: 48px; border: 0; border-radius: 14px; background: #F1EFEA; color: #17191E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 20V10M12 20V4M18 20v-7"></path></svg></button>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null,"tsType":"object"},"$preview":{"width":305,"height":560}}'>
class Component extends DCLogic {
renderVals() {
const it = this.props.item ?? { name: 'Смартфон Xiaomi Redmi Note 9 Pro 6/128 ГБ, серый', price: '22 990 ₽', old: '24 990 ₽', badge: '−8%', color: '#3A3F45', rating: '4,7', img: '../assets/shop/img/rn9.webp' };
const sale = !!it.old;
const n = parseInt(String(it.price).replace(/\D/g, ''), 10) || 0;
const fmt = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const h = String(it.name).split('').reduce((a, ch) => (a * 31 + ch.charCodeAt(0)) % 9973, 7);
const reviewsN = it.reviews ?? (40 + (h % 960));
const word = (k) => { const m10 = k % 10, m100 = k % 100; if (m10 === 1 && m100 !== 11) return 'отзыв'; if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'отзыва'; return 'отзывов'; };
const shops = it.shops ?? (h % 4 === 0 ? 0 : 3 + (h % 14));
const palette = it.colors ?? [it.color, '#22262B', '#E9E6E1'];
return {
name: it.name, img: it.img || '', hasImg: !!it.img, noImg: !it.img, price: it.price, old: it.old, badge: it.badge, color: it.color, rating: it.rating,
hasBadge: !!it.badge, hasOld: sale,
badgeBg: sale ? '#C4281C' : '#17191E',
badgeFg: '#FFFFFF',
priceColor: sale ? '#B4280F' : '#17191E',
reviews: fmt(reviewsN) + ' ' + word(reviewsN),
bonus: fmt(Math.round(n * 0.05 / 10) * 10),
credit: fmt(Math.ceil(n / 12 / 10) * 10),
stock: shops ? 'Забрать сегодня в ' + shops + ' магазинах' : 'Доставка курьером завтра',
stockDot: shops ? '#0B7A55' : '#E07A1F',
colors: palette.map((hex, i) => ({ hex, ring: i === 0 ? '0 0 0 2px #FFFFFF, 0 0 0 3px #17191E' : 'inset 0 0 0 1px rgba(23,25,30,0.2)' })),
colorsLabel: 'Цветов: ' + palette.length
};
}
}
</script>
</body>
</html>
