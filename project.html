    :root {
      --bg: #0e0e11;
      --surface: #17171c;
      --surface-2: #1f1f26;
      --text: #f2f1ee;
      --muted: #9a99a3;
      --accent: #d8ff3e;
      --accent-2: #7b6cff;
      --radius: 20px;
      --font-display: 'Russo One';
      --font-body: 'Golos Text';
      --glass-tint: rgba(235,235,245,.3);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html.fonts-pending body { opacity: 0; }
    html { background: var(--bg); scroll-behavior: smooth; overflow-x: clip; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font-body), system-ui, sans-serif; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      transition: opacity .25s ease;
      overflow-x: clip;
    }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
    h1, h2, h3 { font-family: var(--font-display), sans-serif; line-height: 1.2; font-weight: 400; }
    a { color: inherit; text-decoration: none; }

    /* ---------- nav ---------- */
    nav {
      position: sticky; top: 0; z-index: 10;
      backdrop-filter: blur(14px);
      background: rgba(14,14,17,.75);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    nav .wrap { display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
    .logo { font-family: var(--font-display); font-weight: 400; font-size: 15px; letter-spacing: .02em; white-space: nowrap; }
    .logo span { color: var(--accent); }
    .back {
      font-size: 13px; color: var(--muted);
      padding: 6px 14px; border-radius: 100px;
      background: rgba(235,235,245,.07);
      backdrop-filter: blur(10px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
      transition: color .2s ease, background .2s ease, border-color .2s ease;
    }
    .back:hover { color: var(--text); background: rgba(235,235,245,.12); border-color: rgba(255,255,255,.24); }

    /* ---------- project header ---------- */
    header { padding: 72px 0 56px; position: relative; overflow-x: clip; }
    .glow {
      position: absolute; top: -140px; left: 50%;
      width: 780px; height: 540px; border-radius: 50%;
      transform: translateX(-50%);
      background: radial-gradient(circle, rgba(123,108,255,.22), rgba(216,255,62,.05) 44%, transparent 68%);
      pointer-events: none;
    }
    header .wrap {
      position: relative; display: flex; flex-direction: column;
      align-items: center; text-align: center;
    }
    h1 { font-size: clamp(32px, 6vw, 56px); margin-bottom: 16px; text-wrap: balance; }
    .p-desc {
      color: var(--muted); font-size: 18px; max-width: 620px;
      margin: 0 auto 26px; text-wrap: pretty;
    }
    .p-meta { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .card-tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .card-tags span {
      font-size: 12px; font-weight: 500; color: var(--accent);
      padding: 6px 14px; border-radius: 100px;
      background: rgba(235,235,245,.07);
      backdrop-filter: blur(10px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
      text-shadow: 0 1px 6px rgba(0,0,0,.35);
    }
    .btn {
      display: inline-block; padding: 12px 24px; border-radius: 100px;
      font-weight: 600; font-size: 14px;
      transition: transform .15s ease, box-shadow .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: var(--accent); color: #111;
      box-shadow: 0 10px 30px rgba(216,255,62,.16);
    }
    .btn-primary:hover { box-shadow: 0 14px 36px rgba(216,255,62,.24); }

    /* ---------- gallery: silver glass frames ---------- */
    .btn[hidden] { display: none; }
    .gallery {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 36px 28px; padding-bottom: 56px;
    }
    figure.shot {
      position: relative;
      aspect-ratio: 16 / 9;
      padding: 6px;
      background: var(--glass-tint);
      backdrop-filter: blur(10px) saturate(1.6);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), inset 0 0 14px rgba(255,255,255,.1);
      cursor: pointer;
      -webkit-user-select: none; user-select: none;
      opacity: 0; transform: translateY(36px);
      transition: opacity .7s ease, transform .7s ease, box-shadow .25s ease;
    }
    figure.shot.in { opacity: 1; transform: translateY(0); }
    figure.shot.in:hover {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), inset 0 0 18px rgba(255,255,255,.16), 0 28px 70px rgba(0,0,0,.5);
      transform: translateY(-5px) rotate(0deg) !important;
    }
    figure.shot:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    figure.shot.wide { grid-column: 1 / -1; }
    /* screenshot sits inside the frame, never blurred by the card's backdrop-filter */
    figure.shot > img {
      position: absolute; inset: 6px;
      width: calc(100% - 12px); height: calc(100% - 12px);
      object-fit: cover; object-position: top center;
      border-radius: 14px; display: block;
    }
    /* liquid glass: specular sheen */
    figure.shot::before {
      content: ''; position: absolute; inset: 0; z-index: 3; pointer-events: none;
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.05) 26%, rgba(255,255,255,0) 46%);
    }
    /* signature touch: matte glass caption inside the frame */
    figure.shot .shot-cap {
      position: absolute; left: 16px; right: auto; bottom: 16px; z-index: 4;
      width: fit-content; max-width: calc(100% - 32px);
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border-radius: 16px;
      background: linear-gradient(180deg, rgba(16,16,22,.62) 0%, rgba(12,12,16,.8) 100%);
      backdrop-filter: blur(18px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 8px 24px rgba(0,0,0,.35);
    }
    figure.shot .shot-cap .n {
      font-family: var(--font-display); font-weight: 400;
      font-size: 12px; letter-spacing: .04em; color: var(--accent);
      flex-shrink: 0; text-shadow: 0 1px 6px rgba(0,0,0,.5);
    }
    figure.shot .shot-cap .t {
      font-size: 13px; color: #e8e7ee; min-width: 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 1px 6px rgba(0,0,0,.45);
    }

    /* ---------- lightbox ---------- */
    .lightbox {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(8,8,10,.9); backdrop-filter: blur(14px) saturate(1.2);
      display: none; align-items: center; justify-content: center; flex-direction: column;
      padding: 24px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: min(1200px, 92vw); max-height: min(78vh, calc(100dvh - 190px));
      border-radius: 16px;
      box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 40px 120px rgba(0,0,0,.7);
    }
    .lb-bar {
      width: min(1200px, 92vw); display: flex; align-items: center;
      justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 18px;
      padding: 10px 18px; border-radius: 16px;
      background: linear-gradient(180deg, rgba(20,20,26,.6) 0%, rgba(12,12,16,.78) 100%);
      backdrop-filter: blur(18px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 8px 24px rgba(0,0,0,.35);
    }
    .lb-cap { font-size: 13.5px; color: #c9c8d2; text-shadow: 0 1px 6px rgba(0,0,0,.4); }
    .lb-cap b { color: var(--text); font-weight: 600; }
    .lb-count { font-family: var(--font-display); font-weight: 400; font-size: 12px; color: var(--accent); }
    .lb-btn, .lb-close {
      background: linear-gradient(var(--glass-tint), var(--glass-tint)) rgba(20,20,26,.45);
      backdrop-filter: blur(14px) saturate(1.5);
      border: 1px solid rgba(255,255,255,.26);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 10px 30px rgba(0,0,0,.35);
      color: var(--text); cursor: pointer;
      transition: background .2s ease, box-shadow .2s ease, border-color .2s ease;
    }
    .lb-btn:hover, .lb-close:hover {
      background: linear-gradient(rgba(216,255,62,.24), rgba(216,255,62,.1)) rgba(20,20,26,.45);
      border-color: rgba(216,255,62,.4);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 26px rgba(216,255,62,.18);
    }
    .lb-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 52px; height: 52px; border-radius: 50%;
      font-size: 22px; line-height: 1;
    }
    .lb-prev { left: 22px; }
    .lb-next { right: 22px; }
    .lb-close {
      position: absolute; top: 20px; right: 22px;
      width: 44px; height: 44px; border-radius: 50%;
      font-size: 17px; line-height: 1;
    }

    /* ---------- footer nav ---------- */
    .p-nav {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
      padding: 8px 0 72px;
    }
    .p-nav a {
      display: flex; flex-direction: column; gap: 4px;
      padding: 16px 20px; border-radius: 18px;
      color: var(--muted); font-size: 13px;
      background: var(--glass-tint);
      backdrop-filter: blur(10px) saturate(1.6);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.28), inset 0 0 14px rgba(255,255,255,.1);
      text-shadow: 0 1px 6px rgba(0,0,0,.35);
      transition: box-shadow .25s ease, transform .25s ease;
    }
    .p-nav a:hover {
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.45), inset 0 0 18px rgba(255,255,255,.16), 0 18px 44px rgba(0,0,0,.45);
      transform: translateY(-3px);
    }
    .p-nav a b {
      display: block; color: var(--text); font-family: var(--font-display);
      font-size: 16px; font-weight: 400; margin-top: 2px;
      transition: color .2s ease;
    }
    .p-nav a:hover b { color: var(--accent); }
    .p-nav .next { text-align: right; align-items: flex-end; }

    /* ---------- facts footer band ---------- */
    .facts-band {
      background: var(--surface);
      border-top: 1px solid rgba(255,255,255,.07);
    }
    .facts-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
    }
    .fact {
      padding: 44px 32px;
      border-left: 1px solid rgba(255,255,255,.07);
    }
    .fact:first-child { border-left: none; }
    .fact b {
      display: block; font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .12em;
      color: var(--accent); margin-bottom: 12px;
    }
    .fact span { font-family: var(--font-display); font-size: 16px; line-height: 1.45; display: block; }
    .fact a { color: var(--text); }
    .fact a:hover { color: var(--accent); }
    .footer-line {
      border-top: 1px solid rgba(255,255,255,.07);
      padding: 22px 0; font-size: 13px; color: var(--muted);
    }
    .footer-line .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .footer-line a:hover { color: var(--accent); }

    @media (max-width: 860px) {
      header { padding: 48px 0 40px; }
      .gallery { grid-template-columns: 1fr; gap: 24px; }
      figure.shot.in:hover { transform: translateY(-3px) rotate(0deg) !important; }
      .p-nav { grid-template-columns: 1fr; gap: 12px; padding-bottom: 56px; }
      .p-nav .next { text-align: left; align-items: flex-start; }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
      .lb-btn { width: 42px; height: 42px; }
      .facts-grid { grid-template-columns: 1fr 1fr; }
      .fact { padding: 28px 24px; }
      .fact:nth-child(3) { border-left: none; }
      .fact:nth-child(n+3) { border-top: 1px solid rgba(255,255,255,.07); }
    }
    @media (max-width: 480px) {
      .p-desc { font-size: 16px; }
      figure.shot .shot-cap { left: 12px; right: auto; bottom: 12px; max-width: calc(100% - 24px); padding: 8px 12px; }
      figure.shot .shot-cap .t { font-size: 12px; }
      .lb-bar { padding: 9px 14px; }
      .facts-grid { grid-template-columns: 1fr; }
      .fact { border-left: none; border-top: 1px solid rgba(255,255,255,.07); }
      .fact:first-child { border-top: none; }
    }
  </style>
</head>

const ORDER = ["kord", "cifra", "krista", "goodgrad", "tenderland", "hopmalt", "dj"];
const key = new URLSearchParams(location.search).get("p");
const id = PROJECTS[key] ? key : "kord";
const p = PROJECTS[id];

document.title = p.title + " — Игорь Пономарев";
document.getElementById("pTitle").textContent = p.title;
document.getElementById("pDesc").textContent = p.desc;
document.getElementById("pTags").innerHTML = p.tags.map(t => "<span>" + t + "</span>").join("");
const site = document.getElementById("pSite");
if (p.url) site.href = p.url;
else site.remove();
if (p.live) {
  const live = document.getElementById("pPrototype");
  live.href = p.live;
  live.textContent = p.liveLabel || "Открыть →";
  live.hidden = false;
}
if (p.prototype) {
  const prototype = document.getElementById("pPrototype");
  prototype.href = "prototypes/?p=" + id;
  prototype.hidden = false;
  site.classList.remove("btn-primary");
  document.getElementById("pDesc").textContent += " · Концепт интерфейса";
}

// collage layout: wide / staggered pair / staggered pair / wide
const LAYOUT = ["wide", "", "", "", "", "wide"];
const gallery = document.getElementById("gallery");
p.shots.forEach(([src, cap], i) => {
  const fig = document.createElement("figure");
  fig.className = "shot " + (LAYOUT[i] || "");
  fig.tabIndex = 0;
  fig.setAttribute("role", "button");
  fig.setAttribute("aria-label", "Открыть кадр: " + cap);
  fig.innerHTML =
    '<img src="' + src + '" alt="' + p.title + " — " + cap + '" loading="lazy">' +
    '<div class="shot-cap"><b class="n">' + String(i + 1).padStart(2, "0") + '</b><span class="t">' + cap + "</span></div>";
  fig.addEventListener("click", () => openLb(i));
  fig.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(i); }
  });
  gallery.appendChild(fig);
});

// scroll reveal
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
}, { threshold: 0.12 });
document.querySelectorAll("figure.shot").forEach(f => io.observe(f));

// prev / next project
const idx = ORDER.indexOf(id);
const prev = PROJECTS[ORDER[(idx + ORDER.length - 1) % ORDER.length]];
const next = PROJECTS[ORDER[(idx + 1) % ORDER.length]];
document.getElementById("pNav").innerHTML =
  '<a href="project.html?p=' + ORDER[(idx + ORDER.length - 1) % ORDER.length] + '">← Предыдущий проект<b>' + prev.title + "</b></a>" +
  '<a class="next" href="project.html?p=' + ORDER[(idx + 1) % ORDER.length] + '">Следующий проект →<b>' + next.title + "</b></a>";

// lightbox
const lb = document.getElementById("lightbox");
const lbImg = document.getElementById("lbImg");
const lbCap = document.getElementById("lbCap");
const lbCount = document.getElementById("lbCount");
let cur = 0;
function openLb(i) { cur = i; renderLb(); lb.classList.add("open"); document.body.style.overflow = "hidden"; }
function closeLb() { lb.classList.remove("open"); document.body.style.overflow = ""; }
function renderLb() {
  const [src, cap] = p.shots[cur];
  lbImg.src = src;
  lbCap.innerHTML = "<b>" + p.title + "</b> · " + cap;
  lbCount.textContent = (cur + 1) + " / " + p.shots.length;
}
function step(d) { cur = (cur + d + p.shots.length) % p.shots.length; renderLb(); }
document.getElementById("lbClose").addEventListener("click", closeLb);
document.getElementById("lbPrev").addEventListener("click", e => { e.stopPropagation(); step(-1); });
document.getElementById("lbNext").addEventListener("click", e => { e.stopPropagation(); step(1); });
lb.addEventListener("click", e => { if (e.target === lb) closeLb(); });
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

// show the page only once fonts are ready, with a 1.2s safety timeout
const showPage = () => document.documentElement.classList.remove("fonts-pending");
const fontReady = document.fonts ? document.fonts.ready : Promise.resolve();
Promise.race([fontReady, new Promise(r => setTimeout(r, 1200))]).then(showPage, showPage);
</script>
