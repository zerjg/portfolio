@font-face{font-family:'Geologica';font-style:normal;font-weight:400 700;font-display:swap;src:url("../assets/fonts/dj/geologica-latin.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{--bg:#120E14;--text:#F3E9D8;--muted:#B3A8B8;--dim:#8F8496;--display:'Tektur','Arial Black',sans-serif;--mono:'Martian Mono',Consolas,monospace}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(rgba(243,233,216,.075) 1px,transparent 1.2px);background-size:26px 26px;color:var(--text);font:500 16px/1.5 'Geologica','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--text)}
.layout{display:flex;flex-wrap:wrap;align-items:flex-start}

/* ---------- minimap ---------- */
aside.map{flex:1 1 300px;max-width:100%;align-self:stretch;border-right:1px solid rgba(243,233,216,.08)}
.mm{position:sticky;top:0;padding:28px 18px 24px 22px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:baseline;gap:8px;min-height:44px;text-decoration:none}
.brand small{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brand b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em}
.mm-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mm-head h2{margin:0;font-size:15px;font-weight:700}
.mm-head span{font-family:var(--mono);font-size:12px;color:var(--muted)}
.mm-bar{height:2px;border-radius:1px;background:rgba(243,233,216,.1)}
.mm-bar i{display:block;height:2px;border-radius:1px;width:0;background:var(--text);transition:width .6s ease,background .6s ease}
.tree{position:relative;width:260px;height:640px;margin-top:6px}
.tree svg{position:absolute;inset:0;overflow:visible}
.tree path{transition:stroke-opacity .5s ease,stroke-width .5s ease}
.node{position:absolute;display:flex;align-items:flex-start;gap:8px;min-height:36px;padding:2px 6px 2px 2px;border-radius:8px;text-decoration:none;transition:opacity .4s ease}
.node .dot{flex:none;margin-top:3px;width:12px;height:12px;border-radius:50%;transition:box-shadow .5s ease,transform .5s ease}
.node .lbl{display:flex;flex-direction:column;line-height:1.2;white-space:nowrap}
.node .lbl b{font-size:13px;font-weight:600}
.node .lbl small{font-size:11px;color:var(--muted)}
.node.dim{opacity:.62}
.node[aria-current="location"] .dot{transform:scale(1.15)}
.node[aria-current="location"] .lbl b{font-weight:700}
.node:focus-visible,.chip:focus-visible,.btn:focus-visible,.tile:focus-visible,.play:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.ghost{position:absolute;display:flex;align-items:center;gap:8px;min-height:20px;padding:0 4px 0 2px;color:var(--muted);font-size:11.5px;font-style:italic;white-space:nowrap;background:var(--bg)}
.ghost i{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted)}
.mm p{margin:0;font-size:12.5px;color:var(--dim)}
.back{font-size:13px;color:var(--muted);text-decoration:none;min-height:36px;display:inline-flex;align-items:center}
.back:hover{color:var(--text)}

/* ---------- sections ---------- */
main{flex:999 1 700px;min-width:0}
.sec{position:relative;min-height:900px;padding:88px 56px;border-top:1px solid rgba(243,233,216,.07);display:flex;flex-wrap:wrap;align-items:center;gap:48px 28px;overflow:hidden}
.hero{border-top:0;flex-direction:column;flex-wrap:nowrap;align-items:stretch;justify-content:center;gap:36px;padding:72px 56px 64px}
.hero h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(88px,14.5vw,208px);line-height:.9;letter-spacing:-.035em}
.hero .lead{position:relative;margin:0;max-width:600px;font-size:clamp(20px,2.2vw,26px);line-height:1.4;color:var(--muted)}
.hero .lead span{color:var(--text)}
.hero .facts{font-family:var(--mono);font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:12px;min-height:52px;padding:0 24px;border-radius:999px;border:1px solid rgba(243,233,216,.22);font-weight:600;text-decoration:none;transition:transform .25s ease,border-color .25s ease}
.btn:hover{transform:translateY(-2px);border-color:rgba(243,233,216,.45)}
.text{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:22px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-family:var(--mono);font-size:13px;color:var(--muted)}
.g-title{margin:0;font-family:var(--display);font-weight:800;line-height:.95;letter-spacing:-.03em}
.desc{margin:0;max-width:520px;font-size:21px;line-height:1.5}
.lineage{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid;color:var(--text);text-decoration:none;font-weight:600}
.artists h3{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
.artists ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px}
.artists li{padding:6px 14px;border-radius:999px;background:rgba(243,233,216,.06);border:1px solid rgba(243,233,216,.12);font-size:14px}
.player{max-width:520px;display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;border-radius:18px;background:rgba(243,233,216,.05);border:1px solid rgba(243,233,216,.1)}
.play{flex:none;width:52px;height:52px;border-radius:50%;border:0;color:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
.play .i-pause{display:none}
.player.playing .i-pause{display:block}
.player.playing .i-play{display:none}
.track{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.track b{display:block;font-weight:700;line-height:1.3}
.track small{display:block;font-size:13px;color:var(--muted)}
.wave{height:26px;display:flex;align-items:flex-end;gap:3px}
.bar{flex:1 1 0;border-radius:2px;transform-origin:bottom;transform:scaleY(.55)}
.playing .bar{animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}

/* ---------- illustration ---------- */
.ill{flex:0 1 560px;position:relative;width:560px;height:640px;perspective:1400px}
.ill svg{position:absolute;inset:0;overflow:visible}
.ill .glow{position:absolute;left:30px;top:110px;width:500px;height:420px;border-radius:50%}
.cable-label{position:absolute;padding:2px 8px;border-radius:6px;background:var(--bg);font-family:var(--mono);font-style:italic;font-size:12px;color:var(--muted);white-space:nowrap}
.tw{position:absolute}
.tile{position:absolute;inset:0;transform:rotateX(52deg) rotateZ(-34deg);border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;text-decoration:none}
.tile.real{border:1px solid rgba(243,233,216,.16);background:linear-gradient(150deg,rgba(243,233,216,.13),rgba(243,233,216,.03));box-shadow:0 34px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);color:var(--text)}
.tile.plain{border:1px dashed rgba(243,233,216,.3);background:rgba(18,14,20,.85);color:var(--muted)}
.tile i{width:10px;height:10px;border-radius:50%;margin-bottom:auto}
.tile b{font-family:var(--display);font-weight:700;font-size:13px;line-height:1.15}
.tile small{font-size:11px;color:var(--muted)}
.main-tile{position:absolute;inset:0;transform:rotateX(52deg) rotateZ(-34deg);border-radius:34px;padding:24px 22px;display:flex;flex-direction:column;justify-content:space-between;color:var(--bg)}
.main-tile .top{display:flex;justify-content:space-between;align-items:flex-start}
.main-tile .top b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;max-width:150px}
.bpm{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--mono);line-height:1}
.bpm span{font-size:30px;font-weight:500}
.bpm small{font-size:10px;margin-top:4px}
.grid{position:relative;display:flex;flex-direction:column;gap:5px}
.grid .row{display:flex;align-items:center;gap:2px}
.grid .row span{width:30px;font-family:var(--mono);font-size:7px;font-weight:500}
.grid .row i{width:9px;height:9px;border-radius:2px}
.playhead{position:absolute;left:31px;top:-3px;bottom:-3px;width:11px;border-radius:3px;background:rgba(255,255,255,.4);animation:playhead linear infinite;animation-timing-function:steps(16)}
.sec:not(.in) .playhead{animation-play-state:paused}
@keyframes playhead{from{transform:translateX(0)}to{transform:translateX(185px)}}
.hero-ill{position:absolute;right:24px;bottom:40px;width:460px;height:300px;perspective:1400px}
.hero-ill .ht{position:absolute;width:110px;height:110px;transform:rotateX(52deg) rotateZ(-34deg);border-radius:20px;border:1px solid rgba(243,233,216,.16);box-shadow:0 30px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:flex-end;padding:14px;font-family:var(--display);font-weight:700;font-size:13px}

/* ---------- motion ---------- */
.rv{transition:opacity .9s cubic-bezier(.16,.84,.3,1),transform .9s cubic-bezier(.16,.84,.3,1)}
.armed .sec:not(.in) .rv{opacity:0;transform:translateY(36px)}
.mask{display:block;overflow:hidden;padding-bottom:.08em}
.mask>span{display:block;transition:transform 1.1s cubic-bezier(.16,.84,.3,1)}
.armed .sec:not(.in) .mask>span{transform:translateY(112%)}
.tw,.hero-ill{transition:opacity 1s ease,transform 1.3s cubic-bezier(.16,.84,.3,1)}
.armed .sec:not(.in) .tw,.armed .sec:not(.in) .hero-ill{opacity:0;transform:translateY(70px) scale(.9)}
.glow{transition:opacity 1.6s ease}
.armed .sec:not(.in) .glow{opacity:0}
.cable{stroke-dasharray:1000;stroke-dashoffset:0;transition:stroke-dashoffset 1.6s cubic-bezier(.65,0,.35,1) .35s}
.armed .sec:not(.in) .cable{stroke-dashoffset:1000}
.pulse{stroke-dasharray:46 954;opacity:0;animation:pulse 2.6s linear infinite;transition:opacity .5s 1.8s}
.sec.in .pulse{opacity:1}
@keyframes pulse{from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
.cue{animation:cue 1.8s ease-in infinite}
@keyframes cue{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}

footer{border-top:1px solid rgba(243,233,216,.08);min-height:160px;padding:40px 56px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
footer b{font-family:var(--display);font-weight:800;font-size:20px}
footer span{color:var(--muted)}

@media (max-width:1180px){.hero-ill{display:none}}
@media (min-width:821px) and (max-height:920px){.mm{padding-top:18px;gap:10px}.tree{zoom:.82}}
@media (max-width:820px){
  aside.map{order:2;border-right:0;border-top:1px solid rgba(243,233,216,.08)}
  .mm{position:static}
  .sec{min-height:0;padding:64px 20px}
  .hero{min-height:80vh}
  .ill{zoom:.62}
  footer{padding:32px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

    <div id="genres"></div>
    <footer><b>DJ ZERJG</b><span>Букинг и контакты скоро появятся здесь</span></footer>
  </main>
</div>

    chillhop: { name: 'Chillhop', era: '2010-е', bpm: 85, c: P, desc: 'Спокойный инструментал на медленном хип-хоп бите: тёплое пианино, мягкая гитара, лёгкая винтажная пыль.', from: [{ t: 'Вырос из' }, { id: 'funkyhiphop' }], next: [], parents: [{ id: 'funkyhiphop' }], artists: ['FloFilz', 'Ours Samplus', 'Mothra', 'TM Juke'], track: 'Uferlos', by: 'FloFilz', beat: [['KICK', 'x.....x..x......'], ['SNARE', BACK], ['HAT', 'x.x.x.xxx.x.x.x.']] },
    organichouse: { name: 'Organic House', era: '2010-е', bpm: 121, c: G, desc: 'Быстрый ровный хаус с этнической перкуссией и спокойным природным звучанием. Танцпол на закате.', from: [{ t: 'Вырос из House, а тот — из' }, { id: 'disco' }], next: ['ohe'], parents: [{ id: 'house' }], artists: ['Monkey Safari', 'Rohrer & Stohler', 'D-Nox', 'CHOMBA'], track: 'Push Me', by: 'Monkey Safari', beat: [['KICK', FOUR], ['CLAP', BACK], ['PERC', '..x..x.x..x..x.x']] },
    ohe: { name: 'Organic House Ethnic', era: 'Конец 2010-х', bpm: 114, c: G, desc: 'Органик-хаус помедленнее: ровный ритм, этническая перкуссия и мотивы, от которых уходишь в транс.', from: [{ t: 'Вырос из' }, { id: 'organichouse' }], next: ['oe'], parents: [{ id: 'organichouse' }], artists: ['Hraach', 'Organica', 'Flamar & Olkan', 'Derun'], track: 'Alambari', by: 'Derun, DakhaBrakha', beat: [['KICK', FOUR], ['CLAP', BACK], ['PERC', 'x..x.x..x..x.x..']] },
    oe: { name: 'Organic Ethnic', era: '2020-е', bpm: 98, c: G, desc: 'Этнические мотивы и живая перкуссия на медленном ломаном ритме. Медитативно, глубоко, с восточным воздухом.', from: [{ t: 'Вырос из' }, { id: 'ohe' }], next: [], parents: [{ id: 'ohe' }], artists: ['CloZee', 'Kaya Project', 'Amanati', 'Shankara NZ'], track: 'Soul Sanctuary', by: 'Kaya Project, Bwoy de Bhajan', beat: [['KICK', 'x......x..x.....'], ['SNARE', '....x.........x.'], ['PERC', 'x.xx..x.x.xx..x.']] }
  };
  const ghosts = { hiphop: { name: 'Hip-Hop', era: '1970-е', c: P }, house: { name: 'House', era: '1980-е', c: C } };
  const order = ['soul', 'funk', 'disco', 'funkyhiphop', 'funkyhouse', 'nudisco', 'electroswing', 'chillhop', 'organichouse', 'ohe', 'oe'];
  const info = (id) => D[id] ? { name: D[id].name, era: D[id].era, c: D[id].c, link: true } : Object.assign({ link: false }, ghosts[id]);
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const curve = (x1, y1, x2, y2) => { const m = Math.round((y1 + y2) / 2); return `M${x1} ${y1} C${x1} ${m}, ${x2} ${m}, ${x2} ${y2}`; };
  const pad = (n) => String(n).padStart(2, '0');

  document.getElementById('heroFacts').textContent = order.length + ' жанров · конец 1950-х → 2020-е · 85–126 BPM';

  /* ---------- hero illustration ---------- */
  const heroTiles = [
    { l: 20, t: 10, name: 'Soul', bg: `linear-gradient(150deg,${A},${deep[A]})`, fg: 'var(--bg)' },
    { l: 170, t: 70, name: 'Funk' }, { l: 320, t: 20, name: 'Disco' }, { l: 300, t: 180, name: 'House' }
  ];
  const heroCables = [[curve(75, 65, 225, 125), A], [curve(225, 125, 375, 75), A], [curve(375, 75, 355, 235), C]];
  document.getElementById('heroIll').innerHTML =
    '<svg width="460" height="300" viewBox="0 0 460 300">' +
    heroCables.map(([d, c]) => `<path class="cable" pathLength="1000" d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" style="filter:drop-shadow(0 0 6px ${c})"/><path class="pulse" pathLength="1000" d="${d}" fill="none" stroke="#FFF6E6" stroke-width="2.5" stroke-linecap="round"/>`).join('') +
    '</svg>' +
    heroTiles.map((t) => `<div class="ht" style="left:${t.l}px;top:${t.t}px;background:${t.bg || 'linear-gradient(150deg,rgba(243,233,216,.14),rgba(243,233,216,.03))'};color:${t.fg || 'var(--text)'}">${t.name}</div>`).join('');

  /* ---------- genre sections ---------- */
  const P1 = [[150, 22]], P2 = [[18, 30], [394, 22]], C1 = [[394, 478]], C2 = [[30, 470], [380, 486]], MAIN = [280, 324];
  const html = order.map((id, i) => {
    const g = D[id];
    const nodes = [], cables = [];
    const pp = g.parents.length === 1 ? P1 : P2;
    g.parents.forEach((p, k) => {
      const inf = p.id ? info(p.id) : { name: p.name, era: p.era, c: '#8F8496', link: false };
      const [l, t] = pp[k], cx = l + 66, cy = t + 66;
      nodes.push({ l, t, inf, id: p.id, delay: 260 + k * 120 });
      cables.push({ d: curve(cx, cy, MAIN[0], MAIN[1]), c: inf.c, label: 'вырос из', lx: Math.round((cx + MAIN[0]) / 2) - 34, ly: Math.round((cy + MAIN[1]) / 2) - 12, delay: k * 400 });
    });
    const cc = g.next.length === 1 ? C1 : C2;
    g.next.forEach((n, k) => {
      const inf = info(n);
      const [l, t] = cc[k], cx = l + 66, cy = t + 66;
      nodes.push({ l, t, inf, id: n, delay: 520 + k * 120 });
      cables.push({ d: curve(MAIN[0], MAIN[1], cx, cy), c: inf.c, label: 'дальше', lx: Math.round((cx + MAIN[0]) / 2) - 28, ly: Math.round((cy + MAIN[1]) / 2) - 10, delay: 900 + k * 400 });
    });
    const chip = (gid) => `<a class="chip" href="#${gid}" style="border-color:${D[gid].c}">${esc(D[gid].name)}</a>`;
    let lineage = g.from.map((f) => f.t ? `<span>${esc(f.t)}</span>` : chip(f.id)).join('');
    if (g.next.length) lineage += '<span>Дальше —</span>' + g.next.map((n) => D[n] ? chip(n) : `<span>${esc(ghosts[n].name)}</span>`).join('');
    const len = g.name.length;
    const fs = len > 15 ? 64 : len > 11 ? 76 : len > 6 ? 96 : 120;
    const bars = Array.from({ length: 36 }, (_, j) => {
      const h = 6 + Math.round(20 * Math.abs(Math.sin((j + 1) * (0.7 + i * 0.13)) * Math.cos(j * 0.31 + i)));
      return `<span class="bar" style="height:${h}px;background:${j < 12 ? g.c : 'rgba(243,233,216,.28)'};animation-delay:${(j * 73) % 800}ms"></span>`;
    }).join('');
    const beat = g.beat.map(([k, s]) => `<div class="row"><span>${k}</span>` + s.split('').map((ch, j) => `<i style="background:${ch === 'x' ? 'var(--bg)' : 'rgba(18,14,20,.16)'};margin-left:${j && j % 4 === 0 ? 3 : 0}px"></i>`).join('') + '</div>').join('');
    const tiles = nodes.map((n) => {
      const real = n.id && D[n.id];
      const inner = real
        ? `<a class="tile real" href="#${n.id}" tabindex="-1"><i style="background:${n.inf.c};box-shadow:0 0 10px ${n.inf.c}"></i><b>${esc(n.inf.name)}</b><small>${esc(n.inf.era)}</small></a>`
        : `<div class="tile plain"><b>${esc(n.inf.name)}</b><small>${esc(n.inf.era)}</small></div>`;
      return `<div class="tw" style="left:${n.l}px;top:${n.t}px;width:132px;height:132px;transition-delay:${n.delay}ms">${inner}</div>`;
    }).join('');
    return `
<section class="sec" id="${id}" data-sec="${id}" aria-labelledby="h-${id}">
  <div class="text">
    <div class="meta rv"><span style="color:${g.c}">${pad(i + 1)} / ${order.length}</span><span>${esc(g.era)}</span><span>темп около ${g.bpm} BPM</span></div>
    <h2 class="g-title" id="h-${id}" style="font-size:min(${fs}px, 15vw);color:${g.c}"><span class="mask"><span style="transition-delay:60ms">${esc(g.name)}</span></span></h2>
    <p class="desc rv" style="transition-delay:160ms">${esc(g.desc)}</p>
    <div class="lineage rv" style="transition-delay:240ms">${lineage}</div>
    <div class="artists rv" style="transition-delay:320ms"><h3>Кого слушать</h3><ul>${g.artists.map((a) => `<li>${esc(a)}</li>`).join('')}</ul></div>
    <div class="player rv" style="transition-delay:400ms">
      <button type="button" class="play" data-track="${esc(g.track)}" aria-label="Включить фрагмент: ${esc(g.track)}" style="background:${g.c};box-shadow:0 0 24px ${g.c}55">
        <svg class="i-play" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"/></svg>
        <svg class="i-pause" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <div class="track"><div><b>${esc(g.track)}</b><small>${esc(g.by)}</small></div><div class="wave" aria-hidden="true">${bars}</div></div>
    </div>
  </div>
  <div class="ill" aria-hidden="true">
    <div class="glow" style="background:radial-gradient(closest-side,${g.c}30,rgba(0,0,0,0))"></div>
    <svg width="560" height="640" viewBox="0 0 560 640">${cables.map((cb) => `<path class="cable" pathLength="1000" d="${cb.d}" fill="none" stroke="${cb.c}" stroke-width="2.2" stroke-linecap="round" style="filter:drop-shadow(0 0 7px ${cb.c})"/><path class="pulse" pathLength="1000" d="${cb.d}" fill="none" stroke="#FFF6E6" stroke-width="2.6" stroke-linecap="round" style="animation-delay:${cb.delay}ms"/>`).join('')}</svg>
    ${cables.map((cb) => `<span class="cable-label rv" style="left:${cb.lx}px;top:${cb.ly}px;transition-delay:900ms">${cb.label}</span>`).join('')}
    ${tiles}
    <div class="tw" style="left:148px;top:192px;width:264px;height:264px;transition-delay:120ms">
      <div class="main-tile" style="background:linear-gradient(150deg,${g.c},${deep[g.c]});box-shadow:0 50px 70px rgba(0,0,0,.6),0 0 60px ${g.c}55,inset 0 1px 0 rgba(255,255,255,.45)">
        <div class="top"><b>${esc(g.name)}</b><span class="bpm"><span>${g.bpm}</span><small>BPM</small></span></div>
        <div class="grid"><div class="playhead" style="animation-duration:${(240 / g.bpm).toFixed(3)}s"></div>${beat}</div>
      </div>
    </div>
  </div>
</section>`;
  }).join('');
  document.getElementById('genres').innerHTML = html;

  /* ---------- minimap ---------- */
  const MM = { soul: [40, 18], funk: [40, 82], hiphop: [14, 154], disco: [150, 136], house: [124, 214], funkyhiphop: [14, 268], funkyhouse: [96, 312], nudisco: [180, 356], electroswing: [150, 410], chillhop: [14, 452], organichouse: [96, 500], ohe: [110, 556], oe: [124, 610] };
  const edges = [['soul', 'funk'], ['funk', 'disco'], ['funk', 'hiphop'], ['hiphop', 'funkyhiphop'], ['funkyhiphop', 'chillhop'], ['disco', 'house'], ['disco', 'nudisco'], ['house', 'funkyhouse'], ['house', 'electroswing'], ['house', 'organichouse'], ['organichouse', 'ohe'], ['ohe', 'oe']];
  const tree = document.getElementById('tree');
  tree.innerHTML =
    '<svg aria-hidden="true" width="260" height="640" viewBox="0 0 260 640">' +
    edges.map(([a, b]) => { const [x1, y1] = MM[a], [x2, y2] = MM[b]; return `<path data-a="${a}" data-b="${b}" d="${curve(x1 + 6, y1 + 9, x2 + 6, y2 + 9)}" fill="none" stroke="${info(b).c}" stroke-width="1.5" stroke-opacity=".35" stroke-linecap="round"/>`; }).join('') +
    '</svg>' +
    Object.keys(MM).map((id) => {
      const [x, y] = MM[id], inf = info(id);
      return inf.link
        ? `<a class="node" data-id="${id}" href="#${id}" style="left:${x}px;top:${y}px"><span class="dot" aria-hidden="true" style="background:${inf.c}"></span><span class="lbl"><b>${esc(inf.name)}</b><small>${esc(inf.era)}</small></span></a>`
        : `<span class="ghost" style="left:${x}px;top:${y}px"><i aria-hidden="true"></i>${esc(inf.name)}, ${esc(inf.era)}</span>`;
    }).join('');

  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  function setActive(active) {
    const idx = order.indexOf(active);
    const reached = (id) => { const k = order.indexOf(id); return k >= 0 && idx >= 0 && k <= idx; };
    counter.textContent = (idx >= 0 ? pad(idx + 1) : '00') + ' / ' + order.length;
    progress.style.width = idx >= 0 ? Math.round(((idx + 1) / order.length) * 100) + '%' : '0%';
    progress.style.background = idx >= 0 ? D[active].c : 'var(--text)';
    tree.querySelectorAll('.node').forEach((n) => {
      const id = n.dataset.id, cur = id === active, c = D[id].c;
      if (cur) n.setAttribute('aria-current', 'location'); else n.removeAttribute('aria-current');
      n.classList.toggle('dim', !(idx < 0 || reached(id) || cur));
      n.querySelector('.dot').style.boxShadow = cur ? `0 0 0 4px var(--bg),0 0 0 6px ${c},0 0 18px ${c}` : 'none';
    });
    tree.querySelectorAll('path').forEach((p) => {
      const a = p.dataset.a, b = p.dataset.b;
      const on = reached(b) || (ghosts[b] && reached(a));
      p.setAttribute('stroke-opacity', on ? '.95' : '.35');
      p.setAttribute('stroke-width', on ? '2' : '1.5');
    });
  }
  setActive('top');

  /* ---------- player (visual only) ---------- */
  document.getElementById('genres').addEventListener('click', (e) => {
    const btn = e.target.closest('.play');
    if (!btn) return;
    const player = btn.closest('.player');
    const on = !player.classList.contains('playing');
    document.querySelectorAll('.player.playing').forEach((p) => {
      p.classList.remove('playing');
      const b = p.querySelector('.play'); b.setAttribute('aria-label', 'Включить фрагмент: ' + b.dataset.track);
    });
    if (on) { player.classList.add('playing'); btn.setAttribute('aria-label', 'Остановить фрагмент: ' + btn.dataset.track); }
  });

  /* ---------- scroll reveal and active genre ---------- */
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const secs = document.querySelectorAll('[data-sec]');
  if (!('IntersectionObserver' in window) || reduce) {
    secs.forEach((s) => s.classList.add('in'));
  } else {
    document.getElementById('root').classList.add('armed');
    const ratios = {};
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        ratios[e.target.dataset.sec] = e.isIntersecting ? e.intersectionRatio : 0;
        if (e.isIntersecting && e.intersectionRatio >= 0.3) e.target.classList.add('in');
      });
      let best = 'top', max = 0;
      Object.keys(ratios).forEach((k) => { if (ratios[k] > max) { max = ratios[k]; best = k; } });
      if (max > 0) setActive(best);
    }, { threshold: [0, 0.3, 0.55, 0.8] });
    secs.forEach((s) => io.observe(s));
  }
})();
</script>
</body>
</html>
